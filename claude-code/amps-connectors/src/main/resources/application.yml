# amps-connectors -- AMPS topics bridged into Deephaven tables.
#
# Everything the application does is configured here (docs/07-amps-connectors.md).
# Run against the demo stack with the `demo` profile, which swaps every source for the
# in-process simulator so the pipeline can be exercised without an AMPS server:
#
#   ./gradlew :amps-connectors:bootRun --args="--spring.profiles.active=demo"

spring:
  application:
    name: amps-connectors
  main:
    banner-mode: "off"
    # Nothing else holds the JVM open: there is no web server, and every thread the
    # connectors start is a daemon. Without this the process exits as soon as the
    # application context has finished refreshing.
    keep-alive: true

logging:
  level:
    com.fix42.dashboard.amps: INFO

# Source driver for every connector below. The `demo` profile flips this to SIMULATED.
# A placeholder rather than a profile override of the connector list, because a profile that
# redeclares `amps.connectors` replaces the whole list instead of merging into it.
amps-source-driver: AMPS

amps:
  enabled: true

  # The Deephaven server every connector publishes into. Matches docker/docker-compose.yml:
  # anonymous auth, python console, gRPC on 10000.
  deephaven:
    host: localhost
    port: 10000
    tls: false
    authentication: Anonymous
    console-type: python
    timeout: 30s
    # The poll that notices Deephaven restarting. On a change the tables are re-created and
    # every connector resubscribes from the start, rehydrating the tables.
    health-check-interval: 5s
    reconnect-delay: 5s

  connectors:

    # ---------------------------------------------------------------------------------
    # FIX over a SOW topic -> keyed Deephaven table.
    # The SOW is the state of the world, so an update replaces that key's row, and a
    # subscription replays the whole SOW on connect.
    # ---------------------------------------------------------------------------------
    - name: orders-fix
      enabled: true
      format: FIX
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        transport: tcp
        topic: Orders
        sow: true
        subscription-mode: FULL
        # field-separator defaults to SOH; set it only for a feed that delimits differently
        # (for example `field-separator: "|"`).
        timeout: 10s
        reconnect-delay: 5s
        simulated-rate: 20
        simulated-keys: 25
      deephaven:
        table: amps_orders
        # KEYED | APPEND_ONLY | BLINK | RING. Omitting it follows the topic -- KEYED for a
        # SOW topic, APPEND_ONLY for a journal topic -- which is what this one would pick
        # anyway; it is spelled out here because the choice is now yours to make.
        table-type: KEYED
        publish-mode: FULL
        key-columns: [ClOrdID]
        ingest-timestamp-column: IngestTs
        max-batch-rows: 5000
        flush-interval: 250ms
      # Allowlist: a tag absent from this list is never published, whatever AMPS sends.
      fields:
        - { tag: "11",  column: ClOrdID,      type: STRING }
        - { tag: "37",  column: OrderID,      type: STRING }
        - { tag: "1",   column: Account,      type: STRING }
        - { tag: "55",  column: Symbol,       type: STRING }
        - { tag: "54",  column: Side,         type: STRING }
        - { tag: "38",  column: OrderQty,     type: DOUBLE }
        - { tag: "44",  column: Price,        type: DOUBLE }
        - { tag: "39",  column: OrdStatus,    type: STRING }
        - { tag: "14",  column: CumQty,       type: DOUBLE }
        - { tag: "151", column: LeavesQty,    type: DOUBLE }
        - { tag: "6",   column: AvgPx,        type: DOUBLE }
        - { tag: "60",  column: TransactTime, type: INSTANT }

    # ---------------------------------------------------------------------------------
    # NVFIX over a SOW topic, delta end to end.
    # AMPS sends only the fields that changed; publish-mode DELTA merges each update over
    # the last row for its key so the untouched columns keep their values.
    # ---------------------------------------------------------------------------------
    - name: positions-nvfix
      enabled: true
      format: NVFIX
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        topic: Positions
        sow: true
        subscription-mode: DELTA
        simulated-rate: 10
        simulated-keys: 12
      deephaven:
        table: amps_positions
        table-type: KEYED          # required: a delta publish needs a row to merge into
        publish-mode: DELTA
        key-columns: [Account, Symbol]
        ingest-timestamp-column: IngestTs
        flush-interval: 250ms
        # Publish the AMPS SOW key of each message as a column. Off by default: when it is
        # not set the column does not exist at all. Uncomment to see it in the table.
        # sow-key-column: SowKey
        #
        # ...and key the table on it instead of on the mapped fields. That is the answer for
        # a SOW topic whose key AMPS assigns (a KeyGenerator), where the key cannot be rebuilt
        # from the record body, and it is the only key that survives a removal -- an
        # out-of-focus message may carry no body at all. Replaces the key-columns above.
        # key-columns: [SowKey]
        #
        # Both change the table's schema, so an existing amps_positions has to be dropped
        # first -- the bootstrap refuses to adopt a table whose columns disagree (doc 07 s8).
      fields:
        - { tag: Account,     column: Account,     type: STRING }
        - { tag: Symbol,      column: Symbol,      type: STRING }
        - { tag: Quantity,    column: Quantity,    type: DOUBLE }
        - { tag: AvgCost,     column: AvgCost,     type: DOUBLE }
        - { tag: MarketValue, column: MarketValue, type: DOUBLE }
        - { tag: Currency,    column: Currency,    type: STRING }

    # ---------------------------------------------------------------------------------
    # JSON over a journal topic -> append-only Deephaven table.
    # No SOW to replay, so the subscription starts from the `epoch` bookmark: every restart
    # resubscribes from the beginning of the transaction log.
    # ---------------------------------------------------------------------------------
    - name: trades-json
      enabled: true
      format: JSON
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        topic: Trades
        sow: false
        subscription-mode: FULL
        bookmark: epoch
        simulated-rate: 15
        simulated-keys: 30
      deephaven:
        table: amps_trades
        table-type: APPEND_ONLY
        publish-mode: FULL
        key-columns: []
        ingest-timestamp-column: IngestTs
        max-batch-rows: 10000
        flush-interval: 500ms
      # JSON tags are field names; a dotted tag addresses a nested object (execution.venue).
      fields:
        - { tag: tradeId,           column: TradeID,   type: STRING }
        - { tag: orderId,           column: OrderID,   type: STRING }
        - { tag: symbol,            column: Symbol,    type: STRING }
        - { tag: side,              column: Side,      type: STRING }
        - { tag: quantity,          column: Quantity,  type: DOUBLE }
        - { tag: price,             column: Price,     type: DOUBLE }
        - { tag: "execution.venue", column: Venue,     type: STRING }
        - { tag: tradeTime,         column: TradeTime, type: INSTANT }

    # ---------------------------------------------------------------------------------
    # The same journal topic shape, kept as a bounded tail instead of a growing log.
    #
    # RING publishes a ring_table over a blink table: the connector's rows go into the
    # blink table through its TablePublisher, and only the latest `ring-capacity` of them
    # are retained. Memory is bounded for real -- unlike a ring over an append-only input
    # table, where the input table would go on holding every row underneath it.
    #
    # Use BLINK instead when nothing should be retained at all: downstream aggregations
    # see each row exactly once, which is what a blink table is for.
    # ---------------------------------------------------------------------------------
    - name: ticks-json
      enabled: true
      format: JSON
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        topic: Ticks
        sow: false
        subscription-mode: FULL
        bookmark: epoch
        simulated-rate: 40
        simulated-keys: 50
      deephaven:
        table: amps_ticks
        table-type: RING
        ring-capacity: 5000        # rows retained; ignored by every other table type
        publish-mode: FULL
        key-columns: []            # a ring table has no keys, so this must stay empty
        ingest-timestamp-column: IngestTs
        max-batch-rows: 2000
        flush-interval: 250ms
      fields:
        - { tag: symbol,   column: Symbol,   type: STRING }
        - { tag: price,    column: Price,    type: DOUBLE }
        - { tag: size,     column: Size,     type: LONG }
        - { tag: tickTime, column: TickTime, type: INSTANT }
