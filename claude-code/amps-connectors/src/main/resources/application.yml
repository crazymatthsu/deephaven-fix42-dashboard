# amps-connectors -- AMPS topics bridged into Deephaven tables.
#
# Everything the application does is configured here (docs/07-amps-connectors.md).
# Run against the demo stack with the `demo` profile, which swaps every source for the
# in-process simulator so the pipeline can be exercised without an AMPS server:
#
#   ./gradlew :amps-connectors:bootRun --args="--spring.profiles.active=demo"

spring:
  application:
    name: amps-connectors
  main:
    banner-mode: "off"
    # Nothing else holds the JVM open: there is no web server, and every thread the
    # connectors start is a daemon. Without this the process exits as soon as the
    # application context has finished refreshing.
    keep-alive: true

logging:
  level:
    com.fix42.dashboard.amps: INFO

# Source driver for every connector below. The `demo` profile flips this to SIMULATED.
# A placeholder rather than a profile override of the connector list, because a profile that
# redeclares `amps.connectors` replaces the whole list instead of merging into it.
amps-source-driver: AMPS

amps:
  enabled: true

  # The Deephaven server every connector publishes into. Matches docker/docker-compose.yml:
  # anonymous auth, python console, gRPC on 10000.
  deephaven:
    host: localhost
    port: 10000
    tls: false
    authentication: Anonymous
    console-type: python
    timeout: 30s
    # The poll that notices Deephaven restarting. On a change the tables are re-created and
    # every connector resubscribes from the start, rehydrating the tables.
    health-check-interval: 5s
    reconnect-delay: 5s

  connectors:

    # ---------------------------------------------------------------------------------
    # FIX over a SOW topic -> keyed Deephaven table.
    # The SOW is the state of the world, so an update replaces that key's row, and a
    # subscription replays the whole SOW on connect.
    # ---------------------------------------------------------------------------------
    - name: orders-fix
      enabled: true
      format: FIX
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        transport: tcp
        topic: Orders
        sow: true
        subscription-mode: FULL
        # field-separator defaults to SOH; set it only for a feed that delimits differently
        # (for example `field-separator: "|"`).
        timeout: 10s
        reconnect-delay: 5s
        simulated-rate: 20
        simulated-keys: 25
      deephaven:
        table: amps_orders
        # KEYED | APPEND_ONLY | BLINK | RING. Omitting it follows the topic -- KEYED for a
        # SOW topic, APPEND_ONLY for a journal topic -- which is what this one would pick
        # anyway; it is spelled out here because the choice is now yours to make.
        table-type: KEYED
        publish-mode: FULL
        key-columns: [ClOrdID]
        ingest-timestamp-column: IngestTs
        max-batch-rows: 5000
        flush-interval: 250ms
      # Allowlist: a tag absent from this list is never published, whatever AMPS sends.
      #
      # Two optional per-field knobs shape the value on its way to the column:
      #   decode:        a built-in FIX 4.2 code -> name table, so 54=1 lands as BUY rather
      #                  than 1. A code the table does not name passes through unchanged.
      #   values:        inline code -> value rewrites, applied over `decode` when both are
      #                  set. For a feed the built-in tables do not cover, or a venue that
      #                  deviates from them.
      #   default-value: what to publish when the payload does not carry the field at all.
      #                  Written as the finished value, not a wire code -- it is coerced to
      #                  `type` but never passed through `decode`. A field the payload sends
      #                  *empty* is not defaulted: that is an explicit clear.
      fields:
        - { tag: "11",  column: ClOrdID,      type: STRING }
        - { tag: "37",  column: OrderID,      type: STRING }
        # Not every venue stamps an account. Rather than a null column, publish a placeholder.
        - { tag: "1",   column: Account,      type: STRING, default-value: DUMMY }
        - { tag: "55",  column: Symbol,       type: STRING }
        # 1 -> BUY, 2 -> SELL, 5 -> SELL_SHORT, ... (the full FIX 4.2 table)
        - { tag: "54",  column: Side,         type: STRING, decode: SIDE }
        - { tag: "38",  column: OrderQty,     type: DOUBLE }
        - { tag: "44",  column: Price,        type: DOUBLE }
        # 0 -> NEW, 1 -> PARTIALLY_FILLED, 2 -> FILLED, E -> PENDING_REPLACE, ...
        - { tag: "39",  column: OrdStatus,    type: STRING, decode: ORD_STATUS,
            default-value: UNKNOWN }
        - { tag: "40",  column: OrdType,      type: STRING, decode: ORD_TYPE }
        - { tag: "59",  column: TimeInForce,  type: STRING, decode: TIME_IN_FORCE }
        - { tag: "14",  column: CumQty,       type: DOUBLE }
        - { tag: "151", column: LeavesQty,    type: DOUBLE }
        - { tag: "6",   column: AvgPx,        type: DOUBLE }
        - { tag: "60",  column: TransactTime, type: INSTANT }

    # ---------------------------------------------------------------------------------
    # NVFIX over a SOW topic, delta end to end.
    # AMPS sends only the fields that changed; publish-mode DELTA merges each update over
    # the last row for its key so the untouched columns keep their values.
    # ---------------------------------------------------------------------------------
    - name: positions-nvfix
      enabled: true
      format: NVFIX
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        topic: Positions
        sow: true
        subscription-mode: DELTA
        simulated-rate: 10
        simulated-keys: 12
      deephaven:
        table: amps_positions
        table-type: KEYED          # required: a delta publish needs a row to merge into
        publish-mode: DELTA
        key-columns: [Account, Symbol]
        ingest-timestamp-column: IngestTs
        flush-interval: 250ms
        # Publish the AMPS SOW key of each message as a column. Off by default: when it is
        # not set the column does not exist at all. Uncomment to see it in the table.
        # sow-key-column: SowKey
        #
        # ...and key the table on it instead of on the mapped fields. That is the answer for
        # a SOW topic whose key AMPS assigns (a KeyGenerator), where the key cannot be rebuilt
        # from the record body, and it is the only key that survives a removal -- an
        # out-of-focus message may carry no body at all. Replaces the key-columns above.
        # key-columns: [SowKey]
        #
        # Both change the table's schema, so an existing amps_positions has to be dropped
        # first -- the bootstrap refuses to adopt a table whose columns disagree (doc 07 s8).
      fields:
        - { tag: Account,     column: Account,     type: STRING }
        - { tag: Symbol,      column: Symbol,      type: STRING }
        - { tag: Quantity,    column: Quantity,    type: DOUBLE }
        - { tag: AvgCost,     column: AvgCost,     type: DOUBLE }
        - { tag: MarketValue, column: MarketValue, type: DOUBLE }
        - { tag: Currency,    column: Currency,    type: STRING }

    # ---------------------------------------------------------------------------------
    # JSON over a journal topic -> append-only Deephaven table.
    # No SOW to replay, so the subscription starts from the `epoch` bookmark: every restart
    # resubscribes from the beginning of the transaction log.
    # ---------------------------------------------------------------------------------
    - name: trades-json
      enabled: true
      format: JSON
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        topic: Trades
        sow: false
        subscription-mode: FULL
        bookmark: epoch
        simulated-rate: 15
        simulated-keys: 30
      deephaven:
        table: amps_trades
        table-type: APPEND_ONLY
        publish-mode: FULL
        key-columns: []
        ingest-timestamp-column: IngestTs
        max-batch-rows: 10000
        flush-interval: 500ms
      # JSON tags are field names; a dotted tag addresses a nested object (execution.venue).
      fields:
        - { tag: tradeId,           column: TradeID,   type: STRING }
        - { tag: orderId,           column: OrderID,   type: STRING }
        - { tag: symbol,            column: Symbol,    type: STRING }
        # `values` is the inline form of the same idea, and is not FIX-specific: this feed
        # spells its side as B/S, which no built-in table covers.
        - tag: side
          column: Side
          type: STRING
          values: { "B": BUY, "S": SELL }
        - { tag: quantity,          column: Quantity,  type: DOUBLE }
        - { tag: price,             column: Price,     type: DOUBLE }
        # A trade with no venue on it is still a trade; label it rather than publishing null.
        - { tag: "execution.venue", column: Venue,     type: STRING, default-value: UNKNOWN }
        - { tag: tradeTime,         column: TradeTime, type: INSTANT }

    # ---------------------------------------------------------------------------------
    # The same journal topic shape, kept as a bounded tail instead of a growing log.
    #
    # RING publishes a ring_table over a blink table: the connector's rows go into the
    # blink table through its TablePublisher, and only the latest `ring-capacity` of them
    # are retained. Memory is bounded for real -- unlike a ring over an append-only input
    # table, where the input table would go on holding every row underneath it.
    #
    # Use BLINK instead when nothing should be retained at all: downstream aggregations
    # see each row exactly once, which is what a blink table is for.
    # ---------------------------------------------------------------------------------
    - name: ticks-json
      enabled: true
      format: JSON
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        topic: Ticks
        sow: false
        subscription-mode: FULL
        bookmark: epoch
        simulated-rate: 40
        simulated-keys: 50
      deephaven:
        table: amps_ticks
        table-type: RING
        ring-capacity: 5000        # rows retained; ignored by every other table type
        publish-mode: FULL
        key-columns: []            # a ring table has no keys, so this must stay empty
        ingest-timestamp-column: IngestTs
        max-batch-rows: 2000
        flush-interval: 250ms
      fields:
        - { tag: symbol,   column: Symbol,   type: STRING }
        - { tag: price,    column: Price,    type: DOUBLE }
        - { tag: size,     column: Size,     type: LONG }
        - { tag: tickTime, column: TickTime, type: INSTANT }

    # ---------------------------------------------------------------------------------
    # A map of maps, exploded: one Deephaven row per inner entry.
    #
    # The record is the "nested" cache shape -- amps-demo's cache.entries with a map-valued
    # /value ({"key": "portfolio-1", "value": {"AAPL": {...}, "MSFT": {...}}}) -- whose
    # member names are data, so no static field list can name them. `explode` walks the
    # object at its tag and publishes one row per member: the ordinary fields repeat on
    # every row, the member's name lands in `key-column`, and the explode fields resolve
    # inside the member's value (`.` is the member value itself).
    #
    # On this keyed table the connector also remembers each record's members: a member
    # missing from a republished record deletes its row, and a record leaving the SOW
    # (sow_delete, out-of-focus) deletes all of its rows.
    #
    # The flattened alternative needs none of this: a topic like cache.nested.entries,
    # one record per (outerKey, innerKey) pair on a composite SOW key, is already tabular
    # -- map outerKey/innerKey/value.* directly and key on [OuterKey, InnerKey].
    # ---------------------------------------------------------------------------------
    - name: portfolios-json
      enabled: true
      format: JSON
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        topic: cache.entries
        sow: true
        subscription-mode: FULL      # explode needs whole records; a delta may omit the map
        simulated-rate: 8
        simulated-keys: 6
      deephaven:
        table: amps_portfolios
        table-type: KEYED
        publish-mode: FULL
        key-columns: [OuterKey, Symbol]   # must include explode.key-column
        ingest-timestamp-column: IngestTs
        flush-interval: 250ms
      fields:
        - { tag: key, column: OuterKey, type: STRING }
      explode:
        tag: value                   # the object whose members become rows
        key-column: Symbol           # the member's name
        fields:                      # resolved inside each member's value
          - { tag: qty, column: Qty,      type: DOUBLE }
          - { tag: px,  column: Px,       type: DOUBLE }
          - { tag: ".", column: Position, type: STRING }   # the member value, as JSON text

    # ---------------------------------------------------------------------------------
    # An AMPS composite message type: one message, several length-prefixed parts.
    #
    # The server registers the type (composite-local or composite-global module) under a
    # name of its own, e.g.
    #     <MessageType>
    #       <Name>composite-json-fix</Name>
    #       <Module>composite-local</Module>
    #       <MessageType>json</MessageType>
    #       <MessageType>fix</MessageType>
    #     </MessageType>
    # and that registered name -- not "composite" -- goes in `message-type`, because it is
    # part of the connection URI. `composite-parts` mirrors the constituent list, and tags
    # become part-indexed: `0.orderId` is part 0's orderId, `1.54` is part 1's tag 54 --
    # the same addressing as the /0/orderId XPaths AMPS filters and SOW keys use. An
    # unprefixed tag reads from the merged namespace (first part carrying it wins), which
    # matches how a composite-global topic is filtered.
    # ---------------------------------------------------------------------------------
    - name: orders-composite
      enabled: true
      format: COMPOSITE
      composite-parts: [JSON, FIX]
      source:
        driver: ${amps-source-driver}
        host: localhost
        port: 9007
        message-type: composite-json-fix   # the server's registered type name (goes in the URI)
        topic: orders.composite
        sow: true
        subscription-mode: FULL
        simulated-rate: 10
        simulated-keys: 8
      deephaven:
        table: amps_composite
        table-type: KEYED
        publish-mode: FULL
        key-columns: [OrderId]
        ingest-timestamp-column: IngestTs
        flush-interval: 250ms
      fields:
        - { tag: "0.orderId", column: OrderId, type: STRING }
        - { tag: "0.account", column: Account, type: STRING }
        - { tag: "1.54",      column: Side,    type: STRING, decode: SIDE }
        - { tag: "1.38",      column: Qty,     type: DOUBLE }
        - { tag: "1.44",      column: Price,   type: DOUBLE }
