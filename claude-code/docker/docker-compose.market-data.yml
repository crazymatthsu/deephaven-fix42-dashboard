# Market-data demo stack — one Deephaven server, optionally one MinIO (S3-compatible) bucket.
# Contract: docs/11-market-data-demo.md (§5 configuration, §11 deployment).
#
#   # local parquet files (market-data-demo/data, generated by the module's CLI):
#   podman compose -f docker/docker-compose.market-data.yml up -d --build
#
#   # the same files served from S3 (MinIO), Deephaven reading them through S3Instructions:
#   MD_SOURCE=s3 podman compose -f docker/docker-compose.market-data.yml --profile s3 up -d --build
#   python -m market_data_demo upload --bucket market-data --prefix ohlc --endpoint http://localhost:9000
#
#   podman compose -f docker/docker-compose.market-data.yml down -v
#
# `market-data-demo/scripts/run_demo.sh` does all of the above in the right order.
#
#   host port   container       what
#   ---------   -------------   ---------------------------------------------------------------
#   10000       md-deephaven    the Deephaven IDE (Panels ▸ market_data_dashboard)
#    9000       md-minio        S3 API (profile `s3` only)
#    9001       md-minio        MinIO console, login minioadmin / minioadmin (profile `s3` only)
#
# This is a SEPARATE compose project (`name:` below) from docker/docker-compose.yml and
# docker-compose.remote-uri.yml, with its own container names and network -- but it publishes
# the same host port 10000 as the fix42-dashboard stack, so run one or the other, or set
# DH_PORT=10001 here.
#
# ---------------------------------------------------------------------------------------------
# S3 ADDRESSING. Deephaven's reader is the AWS Java SDK, which addresses a bucket behind a
# custom endpoint VIRTUAL-HOST style: a read of s3://market-data/ohlc/... against
# MD_S3_ENDPOINT=http://minio:9000 goes to http://market-data.minio:9000/ohlc/... (verified
# against 42.4 -- see doc 11 §4.2). Two things below make that resolve and be understood:
#
#   * the minio service carries the network alias `<bucket>.minio`, so the name resolves
#     inside the compose network;
#   * MINIO_DOMAIN=minio tells MinIO to read the bucket out of the Host header.
#
# boto3 (listing / upload) uses path style and is unaffected. Changing MD_S3_BUCKET changes
# the alias with it. Outside compose (a host-side Deephaven against a host-side MinIO) use
# an IP endpoint, e.g. MD_S3_ENDPOINT=http://127.0.0.1:9000: the SDK falls back to path style
# for IP hosts.
# ---------------------------------------------------------------------------------------------

name: market-data-demo

services:

  # ---------------------------------------------------------------------------
  # Deephaven server — runs the market-data-demo app in Application Mode.
  #
  # /md-scripts   = market-data-demo/src        (the market_data_demo package)
  # /market-data  = market-data-demo/data       (the local parquet tree; MD_DATA_DIR overrides)
  # /dh-app-lib   = apps/_lib                   (loader shared by every app)
  # /app.d        = apps/market-data-demo       (this app's descriptor)
  #
  # PYTHONPATH=/md-scripts because app-mode scripts run with __file__ UNSET (verified on
  # 42.4), so the entrypoint cannot bootstrap sys.path from its own location.
  # ---------------------------------------------------------------------------
  deephaven:
    build:
      context: .
      dockerfile: deephaven-market-data.Dockerfile
    image: localhost/fix42-deephaven-market-data:42.4
    container_name: "${DH_CONTAINER:-md-deephaven}"
    hostname: deephaven
    ports:
      - "${DH_PORT:-10000}:10000"
    volumes:
      - ../market-data-demo/src:/md-scripts:ro,z
      - ${MD_DATA_DIR:-../market-data-demo/data}:/market-data:ro,z
      - ./apps/_lib:/dh-app-lib:ro,z
      - ./apps/market-data-demo:/app.d:ro,z
    environment:
      DH_APP: market-data-demo
      PYTHONPATH: "/md-scripts"
      START_OPTS: >-
        -Xmx${DH_XMX:-4g}
        -Ddeephaven.console.type=python
        -Ddeephaven.application.dir=/app.d
        -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler
      # --- where the parquet files come from (doc 11 §5) -------------------------------
      MD_SOURCE: "${MD_SOURCE:-local}"          # local | s3
      MD_LOCAL_ROOT: "/market-data"             # the bind mount above
      MD_S3_BUCKET: "${MD_S3_BUCKET:-market-data}"
      MD_S3_PREFIX: "${MD_S3_PREFIX:-ohlc}"
      MD_S3_REGION: "${MD_S3_REGION:-us-east-1}"
      # In-network MinIO by default. For real AWS S3 set MD_S3_ENDPOINT to an empty string
      # and either pass keys or leave both blank for the default credential chain.
      MD_S3_ENDPOINT: "${MD_S3_ENDPOINT-http://minio:9000}"
      MD_S3_ACCESS_KEY_ID: "${MD_S3_ACCESS_KEY_ID-minioadmin}"
      MD_S3_SECRET_ACCESS_KEY: "${MD_S3_SECRET_ACCESS_KEY-minioadmin}"
      MD_S3_ANONYMOUS: "${MD_S3_ANONYMOUS:-false}"
      # --- dashboard defaults ------------------------------------------------------------
      MD_DEFAULT_SYMBOLS: "${MD_DEFAULT_SYMBOLS:-AAPL,MSFT,NVDA}"
      MD_DEFAULT_DAYS: "${MD_DEFAULT_DAYS:-5}"
      MD_DEFAULT_INTERVAL: "${MD_DEFAULT_INTERVAL:-1m}"
      MD_DEFAULT_CHART: "${MD_DEFAULT_CHART:-candlestick}"
      MD_HIDE_GAPS: "${MD_HIDE_GAPS:-true}"
      MD_MAX_FILES: "${MD_MAX_FILES:-2000}"
      MD_READ_THREADS: "${MD_READ_THREADS:-4}"
    healthcheck:
      test: ["CMD", "/opt/grpc_health_probe/grpc_health_probe", "-addr=localhost:10000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MinIO — an S3-compatible object store, only with `--profile s3`.
  #
  # The bucket is created by `python -m market_data_demo upload` (it calls create_bucket
  # when head_bucket fails), so no `mc` init container is needed. Data lives on a named
  # volume: `down -v` wipes it, `down` keeps it.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: md-minio
    hostname: minio
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MD_S3_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MD_S3_SECRET_ACCESS_KEY:-minioadmin}"
      # Virtual-host addressing: Host `<bucket>.minio` -> that bucket (see the header).
      MINIO_DOMAIN: "minio"
    networks:
      default:
        aliases:
          - "minio"
          - "${MD_S3_BUCKET:-market-data}.minio"
    ports:
      - "${MD_MINIO_PORT:-9000}:9000"
      - "${MD_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - md-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  md-minio-data:
