# FIX 4.2 dashboard demo stack — Kafka (KRaft, single node) + Deephaven server.
#
# Verified on macOS with podman 5.8.2 / podman-compose 1.6.0.
#   podman compose -f docker/docker-compose.yml up -d
#   podman compose -f docker/docker-compose.yml down -v
#
# The Deephaven service runs ONE app out of docker/apps/, selected with DH_APP:
#   DH_APP=example-minimal podman compose -f docker/docker-compose.yml up -d
#
# Image tags are pinned to versions that were pulled and inspected on this machine:
#   apache/kafka:3.9.1          (official Apache Kafka image, KRaft mode)
#   ghcr.io/deephaven/server:42.4  (== :latest at time of writing; python 3.12, JDK 21)
#   kafbat/kafka-ui:v1.5.0      (native arm64; the maintained successor to provectuslabs/kafka-ui)
#
# Both deephaven.ui (deephaven-plugin-ui 0.40.2) and deephaven.plot.express
# (deephaven-plugin-plotly-express 0.20.0) are already bundled in the server image,
# so no derived Dockerfile is required. See README "Deephaven image" section.

name: fix42-dashboard

services:

  # ---------------------------------------------------------------------------
  # Kafka — single-node KRaft (combined broker + controller).
  #
  # Two client listeners so both sides of the demo can reach it:
  #   PLAINTEXT  kafka:9092        <- in-network, used by the deephaven container
  #   EXTERNAL   localhost:19092   <- published to the host, used by the Java generator
  # CONTROLLER:9093 is the internal KRaft quorum listener (never published).
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: fix42-kafka
    hostname: kafka
    ports:
      - "19092:19092"
    environment:
      CLUSTER_ID: "fix42dashboardcluster"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Demo sizing: single node, so every replication factor is 1.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "168"
    # The healthcheck also (idempotently) creates the demo topic. This is load-
    # bearing, not a convenience: Deephaven's kc.consume() resolves the topic's
    # partitions once, at startup. If the topic only springs into existence when
    # the generator first produces, the consumer starts with zero partitions and
    # shuts down immediately -- tables stay empty forever. Gating deephaven on
    # this healthcheck (depends_on: service_healthy) guarantees the topic exists
    # with all 3 partitions before the consumer ever looks.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic fix42.messages --partitions 3 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic fix42.messages"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Deephaven server — runs ONE app from docker/apps/ in Application Mode.
  #
  # Which app is chosen by DH_APP, which names a folder under docker/apps/:
  #
  #     podman compose -f docker/docker-compose.yml up -d                    # fix42-dashboard
  #     DH_APP=example-minimal podman compose -f docker/docker-compose.yml up -d
  #
  # Only the selected folder is mounted at /app.d, so Deephaven sees that app's
  # .app descriptors and no others. Adding an app is adding a folder — see
  # docker/apps/README.md.
  #
  # /scripts     = deephaven-scripts/src  (fix42cache + dh_app python packages)
  # /dh-app-lib  = apps/_lib              (loader shared by every app)
  # /app.d       = apps/${DH_APP}         (the selected app, and only it)
  #
  # PYTHONPATH=/scripts is deliberate: app-mode scripts are evaluated with
  # __file__ UNSET (verified on 42.4), so a script cannot bootstrap sys.path from
  # its own location. Setting PYTHONPATH makes `import fix42cache` / `import dh_app`
  # work no matter how an entrypoint is written.
  #
  # DH_PORT and DH_CONTAINER exist so a second app can run *beside* this one
  # rather than replacing it -- see docker/apps/README.md.
  # ---------------------------------------------------------------------------
  deephaven:
    image: ghcr.io/deephaven/server:42.4
    container_name: "${DH_CONTAINER:-fix42-deephaven}"
    ports:
      - "${DH_PORT:-10000}:10000"
    volumes:
      - ../deephaven-scripts/src:/scripts:ro,z
      - ./apps/_lib:/dh-app-lib:ro,z
      - ./apps/${DH_APP:-fix42-dashboard}:/app.d:ro,z
      # Java engine app (DH_APP=fix42-dashboard-java): `./gradlew :deephaven-app-java:assemble`
      # stages the jar here. Harmless for every other app -- an empty or absent directory makes
      # EXTRA_CLASSPATH expand to nothing and the server starts exactly as before. (podman creates
      # a missing relative host directory rather than failing the mount.)
      - ${DH_JAVA_LIBS:-../deephaven-app-java/build/deploy/libs}:/apps/libs:ro,z
    environment:
      # Echoed into the container so app scripts and log lines can name themselves.
      DH_APP: "${DH_APP:-fix42-dashboard}"
      # bin/start PREPENDS this to the server's own classpath, which is why /apps/libs must never
      # hold a jar the image already ships -- a duplicate would shadow the engine. The staging task
      # only puts our own jar there, because every deephaven dependency is compileOnly.
      EXTRA_CLASSPATH: "/apps/libs/*"
      START_OPTS: >-
        -Xmx4g
        -Ddeephaven.console.type=python
        -Ddeephaven.application.dir=/app.d
        -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler
      PYTHONPATH: "/scripts"
      # Where fix_raw reads its raw FIX from: "kafka" (this stack) or "amps".
      # Both replay their journal from the beginning on every boot, so either way a
      # restart rebuilds the identical cache (docs/03-deephaven-dag.md section 2.1).
      FIX42_SOURCE: "kafka"
      FIX42_KAFKA_BOOTSTRAP: "kafka:9092"
      FIX42_TOPIC: "fix42.messages"
      # To read an AMPS transaction log instead, set FIX42_SOURCE: "amps" and point
      # these at your own broker. AMPS is commercial software with no public image, so
      # there is no AMPS service in this file, and the AMPS python client is not in the
      # Deephaven image either -- it has to be installed:
      #   podman exec fix42-deephaven pip install amps-python-client
      # See the "AMPS transaction log as the source" section of the README.
      #
      # FIX42_AMPS_URI: "tcp://amps:9007/amps/fix"   # comma-separated for an HA pair
      # FIX42_AMPS_TOPIC: "fix42.messages"           # defaults to FIX42_TOPIC
      # FIX42_AMPS_BOOKMARK: "epoch"                 # epoch | now | most_recent | literal
      # FIX42_AMPS_FILTER: ""                        # optional server-side content filter
      # FIX42_AMPS_CLIENT_NAME: "dh-fix42-dashboard"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/grpc_health_probe/grpc_health_probe", "-addr=localhost:10000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # kafka-ui -- browse the broker: topics, partitions, offsets and the actual
  # message payloads on fix42.messages.
  #
  # Read-only inspection tool, not part of the pipeline: nothing depends on it and
  # the demo works without it. It is the quickest way to answer "did the generator
  # actually publish?" separately from "did Deephaven consume?", which otherwise
  # both look like an empty dashboard.
  #
  # Reaches the broker on the in-network listener (kafka:9092), never the host-side
  # EXTERNAL one -- it runs inside the compose network like the deephaven service.
  #
  # DYNAMIC_CONFIG_ENABLED lets the UI add clusters at runtime; left off so the
  # container stays stateless and reproducible from this file alone.
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: fix42-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "fix42"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      DYNAMIC_CONFIG_ENABLED: "false"
      # The FIX payloads are SOH-delimited text, not Avro/Protobuf: read both key
      # and value as plain strings so the Messages tab shows them directly.
      KAFKA_CLUSTERS_0_DEFAULTKEYSERDE: "String"
      KAFKA_CLUSTERS_0_DEFAULTVALUESERDE: "String"
      SERVER_SERVLET_CONTEXT_PATH: "/"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
