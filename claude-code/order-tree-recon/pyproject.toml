[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-tree-recon"
version = "0.1.0"
description = "Raptor -> algo -> order router order tree in Deephaven: link three systems' orders, search by moniker/symbol/side, reconcile CumQty/LeavesQty per edge and per level"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "deephaven-fix42-dashboard" }]
# No runtime dependency: the reference, the mock book, the FIX parser and the filters are
# pure python, and the Deephaven layer runs inside the server, where `deephaven` and
# `deephaven.ui` are bundled (and, for OTR_SOURCE=amps, the AMPS client is installed).
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Host-side AMPS tools: fixstate_mock --publish and fixstate_check --amps. The Deephaven
# image for OTR_SOURCE=amps has its own copy (docker/deephaven-amps.Dockerfile).
amps = ["amps-python-client==5.3.5.7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
