services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.18
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --smp
      - "1"
      - --memory
      - 1G
      - --mode
      - dev-container
    ports:
      - "8081:8081"
      - "18081:18081"
      - "9092:9092"
      - "19092:19092"

  deephaven:
    build:
      context: ..
      dockerfile: compose/Dockerfile
    ports:
      - "${DEEPHAVEN_PORT:-10000}:10000"
    volumes:
      - ./data:/data
    environment:
      - KAFKA_BOOTSTRAP=redpanda:9092
      - FIX_TOPIC=fix42.dropcopy
      - START_OPTS=-Xmx4g -Ddeephaven.application.dir=/app.d -Dauthentication.psk=deephaven
    depends_on:
      - redpanda
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',10000),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  amps-connectors:
    build:
      context: ..
      dockerfile: compose/Dockerfile.amps
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DEEPHAVEN_HOST: deephaven
      DEEPHAVEN_PORT: "10000"
      DEEPHAVEN_PSK: deephaven
      AMPS_HOST: ${AMPS_HOST:-host.containers.internal}
      AMPS_PORT: ${AMPS_PORT:-9007}
    depends_on:
      deephaven:
        condition: service_healthy
    restart: on-failure
